name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Run JAR and check CSV round-trip
        shell: bash
        run: |
          java -jar target/kzp-lab1-herei-1.4.0.jar --version
          java -jar target/kzp-lab1-herei-1.4.0.jar --input data/input_lab05.csv --output target/ci-report.txt --csv target/ci-movies.csv
          grep -q "Round-trip: успішно" target/ci-report.txt

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/kzp-lab1-herei-1.4.0.jar

      - name: Upload CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.os }}-${{ github.run_number }}
          path: target/ci-movies.csv