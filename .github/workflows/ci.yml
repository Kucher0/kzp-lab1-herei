name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show CI build number
        run: echo "CI build ${{ github.run_number }}"

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

      - name: Run JAR and check CSV round-trip
        shell: bash
        run: |
          java -jar target/kzp-lab1-herei-1.4.0.jar --version
          java -jar target/kzp-lab1-herei-1.4.0.jar --input data/input_lab05.csv --output target/ci-report.txt --csv target/ci-movies.csv
          grep -q "Round-trip: успішно" target/ci-report.txt

      - name: Check CSV encoding and line separators
        shell: bash
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "First bytes (hex): $(od -An -tx1 -N4 target/ci-movies.csv)"
          bom=$(od -An -tx1 -N3 target/ci-movies.csv | tr -d ' \n')
          if [ "$bom" = "efbbbf" ]; then echo "UTF-8 BOM found"; exit 1; fi
          cr_count=$(tr -cd '\r' < target/ci-movies.csv | wc -c | tr -d ' ')
          lf_count=$(tr -cd '\n' < target/ci-movies.csv | wc -c | tr -d ' ')
          echo "CR count: $cr_count, LF count: $lf_count"
          if [ "${{ runner.os }}" = "Windows" ]; then expected_cr="$lf_count"; else expected_cr=0; fi
          if [ "$cr_count" -ne "$expected_cr" ]; then echo "Unexpected CR count"; exit 1; fi
          if [ "$lf_count" -ne 7 ]; then echo "Expected 7 CSV rows (header + 6 records)"; exit 1; fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/kzp-lab1-herei-1.4.0.jar

      - name: Upload CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.os }}-${{ github.run_number }}
          path: target/ci-movies.csv